  <text x="400" y="305" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="22" fill="#f3f4f6" text-anchor="middle" letter-spacing="3">GAMER ESCROW</text>
  <text x="400" y="332" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="13" fill="#64748b" text-anchor="middle" letter-spacing="1.5">SECURE GAME ASSET</text>
